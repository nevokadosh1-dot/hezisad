<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- waveform -->
  <g stroke="#93c5fd" stroke-width="6" stroke-linecap="round">
    <line x1="24" y1="76" x2="24" y2="92"/>
    <line x1="38" y1="68" x2="38" y2="100"/>
    <line x1="52" y1="58" x2="52" y2="110"/>
    <line x1="66" y1="66" x2="66" y2="102"/>
    <line x1="80" y1="72" x2="80" y2="96"/>
    <line x1="94" y1="64" x2="94" y2="104"/>
    <line x1="108" y1="74" x2="108" y2="94"/>
  </g>
  <!-- Hebrew letter tav for "תמלול" (transcription) -->
  <text x="64" y="52" font-family="Arial, 'Segoe UI', sans-serif" font-size="46"
        font-weight="bold" fill="#f8fafc" text-anchor="middle">ת</text>
</svg>
